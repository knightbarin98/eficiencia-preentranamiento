run_name: tuning_100
mode: real
seed: 1337
device: auto
paths:
  platif_root: /mnt/llm-storage/bone-dataset/PlaTiF
  platif_xlsx: /mnt/llm-storage/bone-dataset/PlaTiF/Tibial_Plateau_Fracture_Metadata.xlsx
  radimagenet_resnet50: /mnt/llm-storage/weights/RadImageNet_pytorch/ResNet50.pt
  output_root: ./outputs
model:
  backbone: resnet50
  num_classes: 1
  img_size: 224
  drop_rate: 0.4
  expected_tensors:
    radimagenet: 318
comparators:
- radimagenet
- imagenet
- random
train:
  epochs: 60
  batch_size: 32
  lr: 0.0002
  backbone_lr_mult: 1.0
  weight_decay: 0.0001
  optimizer: adam
  num_workers: 0
  early_stopping_patience: 15
  min_epochs: 20
  threshold_metric: youden
  class_weighted_loss: true
augment:
  enabled: true
  hflip_p: 0.5
  rotation_deg: 10
  scale_range:
  - 0.85
  - 1.0
  brightness: 0.15
  contrast: 0.15
splits:
  n_folds: 5
  internal_val_folds: 5
eval:
  view_aggregation: mean_logit
  bootstrap:
    n_boot: 2000
    ci: 0.95
qc:
  min_resolution: 256
  dup_hamming_threshold: 5
  dup_scope: cross_patient
  check_mask_concordance: true
  manual_exclusions_csv: null
toy:
  n_patients: 40
  views_choices:
  - 1
  - 1
  - 2
  - 2
  - 2
  - 3
  - 3
  - 4
  - 5
  - 6
  - 8
  positive_rate: 0.67
  n_mixed_patients: 2
